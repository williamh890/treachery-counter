@if (authService.currentUser(); as user) {
  <button
    mat-button
    [matMenuTriggerFor]="menu"
    class="gap-2"
    [attr.aria-label]="'Account menu for ' + user.email"
  >
    @if (user.photoURL) {
      <img
        [src]="user.photoURL"
        alt=""
        referrerpolicy="no-referrer"
        class="size-6 rounded-full"
      />
    } @else {
      <mat-icon>account_circle</mat-icon>
    }
  </button>

  <mat-menu #menu="matMenu" xPosition="before">
    <div class="px-4 py-2">
      <p class="text-sm font-medium">{{ user.displayName }}</p>
      <p class="text-xs opacity-70">{{ user.email }}</p>
    </div>
    <mat-divider />
    <button mat-menu-item (click)="authService.signOut()">
      <mat-icon>logout</mat-icon>
      <span>Sign out</span>
    </button>
  </mat-menu>
} @else {
  <button
    type="button"
    class="inline-flex h-10 items-center gap-3 rounded border border-[#747775] bg-white px-3
           text-sm font-medium text-[#1f1f1f] transition-colors hover:bg-[#f2f2f2]
           focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4285F4]"
    (click)="signInWithGoogle()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="size-[18px] shrink-0" aria-hidden="true">
      <path
        fill="#EA4335"
        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
      />
      <path
        fill="#4285F4"
        d="M46.5 24c0-1.61-.15-3.16-.41-4.69H24v9h12.75c-.55 2.87-2.17 5.31-4.61 6.94l7.19 5.57c4.21-3.87 6.67-9.57 6.67-16.82z"
      />
      <path
        fill="#FBBC05"
        d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"
      />
      <path
        fill="#34A853"
        d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.19-5.57c-1.99 1.34-4.55 2.13-7.7 2.13-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
      />
    </svg>
    <span>Sign in with Google</span>
  </button>
}
