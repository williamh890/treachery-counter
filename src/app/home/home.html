<div class="flex min-h-dvh flex-col items-center justify-center gap-4">
  <h1 class="text-lg font-semibold">Treachery Counter</h1>

  <a matButton="elevated" routerLink="/game" routerLinkActive="text-primary font-semibold">Start Game</a>
  <a matButton="elevated" routerLink="/profiles" routerLinkActive="text-primary font-semibold">Profiles</a>
  <a matButton="elevated" routerLink="/profiles" routerLinkActive="text-primary font-semibold">Profiles</a>


  @if (authService.currentUser(); as user) {
    <div class="profile-card">
      <p>Logged in as: <strong>{{ user.email }}</strong></p>
      <button (click)="authService.logOut()">Sign Out</button>
    </div>
  } @else {
    <button (click)="signInWithGoogle()">
      Sign in with Google
    </button>
  }
</div>
